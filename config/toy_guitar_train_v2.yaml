# Separate multi-pose experiment. V1 and staff-vest settings stay unchanged.
dataset:
  output: data/toy_guitar_dataset_v2_20261021
  names: {0: toy, 1: white_guitar}
  min_box_pixels: 8
  sources:
    - id: original
      annotations: D:/RetailVisionDev/runtime/annotations/2026_10_21_16_56_05_3s
